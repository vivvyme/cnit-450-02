---
- name: Start Main LocalHost Gatherfacts
  delegate_to: localhost
  connection: local
  block:
    - name: Discover TTY Devices
      ansible.builtin.command: "sudo dmesg | grep tty"
      become: true
      register: gf_discovered_tty
      changed_when: false

    - name: Filter Output for TTY Devices Specifically
      ansible.builtin.debug:
        msg: "{{ gf_discovered_tty.stdout_lines | select('search', 'tty', ignorecase=true) | list }}"
